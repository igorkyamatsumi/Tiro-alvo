<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Tiro ao Alvo - Three.js</title>
    <!-- Importando Three.js Nativo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background-color: #000;
      }

      /* Interface das Telas */
      .ui-layer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.85);
        color: white;
        text-align: center;
        padding: 20px;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      p {
        font-size: 15px;
        color: #ddd;
        max-width: 320px;
        line-height: 1.5;
        margin-bottom: 25px;
      }

      .btn {
        width: 100%;
        max-width: 260px;
        padding: 16px 20px;
        font-size: 18px;
        font-weight: bold;
        color: white;
        background: #E50914;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(229, 9, 20, 0.5);
        margin-bottom: 15px;
        -webkit-tap-highlight-color: transparent;
      }

      .btn-secondary {
        background: #0055FF;
        box-shadow: 0 4px 15px rgba(0, 85, 255, 0.5);
      }

      .btn-quit {
        background: #333;
        color: #fff;
        font-size: 13px;
        padding: 8px 14px;
        border-radius: 20px;
        border: 1px solid #666;
        width: auto;
        margin: 0;
        box-shadow: none;
      }

      /* HUD em cima da câmera */
      #hud {
        position: absolute;
        top: 15px;
        left: 15px;
        right: 15px;
        display: none;
        justify-content: space-between;
        align-items: center;
        color: white;
        font-size: 20px;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        z-index: 500;
        pointer-events: none;
      }

      #hud * {
        pointer-events: auto;
      }

      /* Retículo de mira central */
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 20px;
        height: 20px;
        margin-top: -10px;
        margin-left: -10px;
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        pointer-events: none;
        z-index: 400;
        display: none;
      }

      #crosshair::after {
        content: '';
        position: absolute;
        top: 8px;
        left: 8px;
        width: 4px;
        height: 4px;
        background: white;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>

    <!-- Menu Inicial -->
    <div id="start-layer" class="ui-layer">
      <h1>Tiro ao Alvo AR</h1>
      <p>
        Vermelho = 10 pts<br>
        <b>Preto & Azul (Especial) = 20 pts</b><br><br>
        Gire o celular em 360° para encontrar alvos espalhados no ambiente!
      </p>
      <button class="btn" onclick="startGame('arcade')">MODO ARCADE (30s)</button>
      <button class="btn btn-secondary" onclick="startGame('livre')">MODO LIVRE (Treino)</button>
    </div>

    <!-- Tela de Game Over -->
    <div id="game-over-layer" class="ui-layer" style="display: none;">
      <h1>Fim de Jogo!</h1>
      <p>Pontuação Final:<br><span id="final-score" style="font-size: 36px; color: #E50914; font-weight: bold;">0</span> PONTOS</p>
      <button class="btn" onclick="startGame(gameMode)">JOGAR NOVAMENTE</button>
      <button class="btn btn-secondary" onclick="returnToMenu()">MENU PRINCIPAL</button>
    </div>

    <!-- HUD -->
    <div id="hud">
      <div>Pontos: <span id="score-val">0</span></div>
      <div id="timer-box">Tempo: <span id="timer-val">30</span>s</div>
      <button class="btn btn-quit" onclick="returnToMenu()">Sair / Menu</button>
    </div>

    <!-- Mira Central -->
    <div id="crosshair"></div>

    <script>
      let camera, scene, renderer;
      let targets = [];
      let score = 0;
      let timeLeft = 30;
      let gameMode = 'arcade';
      let gameStarted = false;
      let timerInterval = null;
      let spawnInterval = null;

      let normalTexture, specialTexture;

      // Textura Vermelha
      function createNormalTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        const rings = ['#E50914', '#FFFFFF', '#E50914', '#FFFFFF', '#E50914'];
        rings.forEach((color, i) => {
          ctx.beginPath();
          ctx.arc(128, 128, 128 - (i * 24), 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
        });
        return new THREE.CanvasTexture(canvas);
      }

      // Textura Azul/Preta (Alvo Especial)
      function createSpecialTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        const rings = ['#0055FF', '#000000', '#0055FF', '#000000', '#00E5FF'];
        rings.forEach((color, i) => {
          ctx.beginPath();
          ctx.arc(128, 128, 128 - (i * 24), 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
        });
        return new THREE.CanvasTexture(canvas);
      }

      function initThreeJS() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);


        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);

        normalTexture = createNormalTexture();
        specialTexture = createSpecialTexture();

        // Câmera Traseira Nativa
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
          .then(stream => {
            const video = document.createElement('video');
            video.srcObject = stream;
            video.play();
            video.style.position = 'fixed';
            video.style.top = '0';
            video.style.left = '0';
            video.style.width = '100vw';
            video.style.height = '100vh';
            video.style.objectFit = 'cover';
            video.style.zIndex = '-1';
            document.body.appendChild(video);
          })
          .catch(err => {
            console.warn("Permissão de câmera não concedida:", err);
          });

        window.addEventListener('resize', onWindowResize);
        window.addEventListener('touchstart', onTouchStart, { passive: false });
        window.addEventListener('click', onClick);

        animate();
      }

      // Rotação da Câmera 3D via Giroscópio
      // Constantes de compensação (devem ficar fora da função)
const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // Compensa a inclinação de -90 graus
const zee = new THREE.Vector3(0, 0, 1);
const q0 = new THREE.Quaternion();

function onDeviceOrientation(event) {
  if (event.alpha !== null) {
    const alpha = event.alpha ? THREE.MathUtils.degToRad(event.alpha) : 0;
    const beta = event.beta ? THREE.MathUtils.degToRad(event.beta) : 0;
    const gamma = event.gamma ? THREE.MathUtils.degToRad(event.gamma) : 0;
    
    // Verifica a orientação da tela (retrato ou paisagem) para manter o horizonte reto
    let orientAngle = 0;
    if (screen.orientation && screen.orientation.angle !== undefined) {
      orientAngle = screen.orientation.angle;
    } else if (window.orientation !== undefined) {
      orientAngle = window.orientation;
    }
    const orient = THREE.MathUtils.degToRad(orientAngle);

    // Aplica a rotação original do giroscópio
    const euler = new THREE.Euler(beta, alpha, -gamma, 'YXZ');
    camera.quaternion.setFromEuler(euler);
    
    // Multiplica pelas compensações matemáticas para a câmera olhar para a frente
    camera.quaternion.multiply(q1);
    camera.quaternion.multiply(q0.setFromAxisAngle(zee, -orient));
  }
}

      function spawnTarget() {
        if (!gameStarted) return;
        if (targets.length >= 5) return;

        const isSpecial = Math.random() < 0.35;
        const mat = new THREE.MeshBasicMaterial({
          map: isSpecial ? specialTexture : normalTexture,
          transparent: true,
          side: THREE.DoubleSide
        });

        // Tamanho de 0.8m a 1.5m
        const size = 0.8 + Math.random() * 0.7;
        const geo = new THREE.PlaneGeometry(size, size);
        const mesh = new THREE.Mesh(geo, mat);

        mesh.userData = { isSpecial: isSpecial, hit: false };

        // DISTÂNCIA REAL: 6 a 10 metros de distância
        const angle = Math.random() * Math.PI * 2;
        const distance = 6.0 + Math.random() * 4.0;
        const height = (Math.random() - 0.5) * 4.0;

        mesh.position.set(
          camera.position.x + Math.cos(angle) * distance,
          camera.position.y + height,
          camera.position.z + Math.sin(angle) * distance
        );

        mesh.lookAt(camera.position);

        scene.add(mesh);
        targets.push(mesh);

        setTimeout(() => { removeTarget(mesh); }, 6500);
      }

      function removeTarget(mesh) {
        const idx = targets.indexOf(mesh);
        if (idx !== -1) {
          targets.splice(idx, 1);
          scene.remove(mesh);
          if (mesh.geometry) mesh.geometry.dispose();
          if (mesh.material) mesh.material.dispose();
        }
      }

      function checkShoot(clientX, clientY) {
        if (!gameStarted) return;

        const mouse = new THREE.Vector2();
        mouse.x = (clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(clientY / window.innerHeight) * 2 + 1;

        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(mouse, camera);

        const intersects = raycaster.intersectObjects(targets);

        if (intersects.length > 0) {
          const hitMesh = intersects[0].object;
          if (hitMesh && !hitMesh.userData.hit) {
            hitMesh.userData.hit = true;
            const pts = hitMesh.userData.isSpecial ? 20 : 10;
            score += pts;
            document.getElementById('score-val').innerText = score;
            removeTarget(hitMesh);
          }
        }
      }

      function onTouchStart(e) {
        if (e.target.tagName === 'BUTTON') return;
        if (e.touches.length > 0) {
          checkShoot(e.touches[0].clientX, e.touches[0].clientY);
        }
      }

      function onClick(e) {
        if (e.target.tagName === 'BUTTON') return;
        checkShoot(e.clientX, e.clientY);
      }

      function solicitarPermissaoGiroscopio() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
       // Requerimento para iOS 13+
      DeviceOrientationEvent.requestPermission()
        .then(permissionState => {
          if (permissionState === 'granted') {
           window.addEventListener('deviceorientation', onDeviceOrientation, false);
          } else {
            alert("Permissão para usar o giroscópio foi negada.");
          }
            })
          .catch(console.error);
               } else {
                  // Para Android e dispositivos não-iOS 13+
             window.addEventListener('deviceorientation', onDeviceOrientation, false);
          }
        }

      function startGame(mode) {
        solicitarPermissaoGiroscopio();

        gameMode = mode;
        score = 0;
        timeLeft = 30;
        gameStarted = true;

        document.getElementById('start-layer').style.display = 'none';
        document.getElementById('game-over-layer').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('crosshair').style.display = 'block';
        document.getElementById('score-val').innerText = score;

        [...targets].forEach(removeTarget);

        if (gameMode === 'arcade') {
          document.getElementById('timer-box').style.display = 'block';
          document.getElementById('timer-val').innerText = timeLeft;
          if (timerInterval) clearInterval(timerInterval);
          timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-val').innerText = timeLeft;
            if (timeLeft <= 0) endGame();
          }, 1000);
        } else {
          document.getElementById('timer-box').style.display = 'none';
        }

        if (spawnInterval) clearInterval(spawnInterval);
        spawnTarget();
        spawnInterval = setInterval(spawnTarget, 2000);
      }

      function endGame() {
        gameStarted = false;
        clearInterval(timerInterval);
        clearInterval(spawnInterval);
        [...targets].forEach(removeTarget);

        document.getElementById('hud').style.display = 'none';
        document.getElementById('crosshair').style.display = 'none';
        document.getElementById('final-score').innerText = score;
        document.getElementById('game-over-layer').style.display = 'flex';
      }

      function returnToMenu() {
        gameStarted = false;
        clearInterval(timerInterval);
        clearInterval(spawnInterval);
        [...targets].forEach(removeTarget);

        document.getElementById('hud').style.display = 'none';
        document.getElementById('crosshair').style.display = 'none';
        document.getElementById('game-over-layer').style.display = 'none';
        document.getElementById('start-layer').style.display = 'flex';
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }

      window.onload = initThreeJS;
    </script>
  </body>
</html>
